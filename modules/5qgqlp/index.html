<script>
  (() => {
    const P = "modulex-acilis-kartvizit";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const vizitCevir = (s, P) => {
        const k = s.querySelector("[data-vizit]");
        const b = s.querySelector("[data-vizit-cevir]");
        if (!k || !b) return;
        const on = k.querySelector("[data-yuz=on]");
        const arka = k.querySelector("[data-yuz=arka]");
        s.classList.add(P + "--vjs");
        b.hidden = false;
        const yaz = (a) => {
          k.classList.toggle(P + "-vkart--arka", a);
          b.setAttribute("aria-pressed", String(a));
          if (on) on.inert = a;
          if (arka) arka.inert = !a;
        };
        b.addEventListener("click", () => yaz(!k.classList.contains(P + "-vkart--arka")));
        yaz(false);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      vizitCevir(s, P, az);
    });
  })();
</script>
